name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            bench/go.sum
      - name: build
        shell: bash
        run: go build ./... && go vet ./...
      - name: test -race
        shell: bash
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest # v2.x, matches the version: "2" .golangci.yml
      - name: zero-dependency root module
        shell: bash
        run: |
          if grep -q '^require' go.mod; then
            echo "root go.mod must stay dependency-free (bbolt/pebble belong in bench/)" >&2
            exit 1
          fi

  bench-module:
    name: bench module (kvlite vs bbolt vs pebble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - name: build + vet + test -race
        shell: bash
        working-directory: bench
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: kvbench smoke
        shell: bash
        working-directory: bench
        run: go run ./cmd/kvbench -n 2000 -sizes 100 -engines kvlite,bbolt,pebble

  fuzz-smoke:
    name: fuzz smoke (every Fuzz* target, 20 s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: FuzzRecord
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzRecord$' -fuzztime=20s ./internal/record/
      - name: FuzzSegmentScan
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzSegmentScan$' -fuzztime=20s ./internal/segment/
      - name: FuzzHint
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzHint$' -fuzztime=20s ./internal/segment/
      - name: FuzzParseName
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzParseName$' -fuzztime=20s ./internal/segment/
      - name: FuzzManifest
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzManifest$' -fuzztime=20s ./internal/manifest/
      - name: FuzzCommitMarker
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzCommitMarker$' -fuzztime=20s .
      - name: FuzzDB
        shell: bash
        run: go test -run '^$' -fuzz='^FuzzDB$' -fuzztime=20s .
      - name: replay committed corpus
        shell: bash
        run: go test -run 'TestFuzzSeedsReplay|TestGolden' -count=1 . ./internal/record/ ./internal/segment/

  goreleaser:
    name: goreleaser (check; snapshot build on tags)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - name: snapshot build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: upload snapshot artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: kvlite-snapshot
          path: dist/*
          retention-days: 7
