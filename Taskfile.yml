version: "3"

vars:
  APP: kvlite
  MAIN: ./cmd/kvlite
  BIN: bin/{{.APP}}{{exeExt}}
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

env:
  CGO_ENABLED: "0"

tasks:
  default:
    cmds:
      - task --list

  tidy:
    desc: go mod tidy + verify for the root and the nested bench module
    cmds:
      - go mod tidy
      - go mod verify
      - cmd: go mod tidy
        dir: bench
      - cmd: go mod verify
        dir: bench

  build:
    desc: Build into bin/
    cmds:
      - go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o {{.BIN}} {{.MAIN}}
    sources: ["**/*.go", go.mod, go.sum]
    generates: ["{{.BIN}}"]

  install:
    desc: go install into GOPATH/bin
    cmds:
      - go install -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" {{.MAIN}}

  run:
    desc: go run with args  (task run -- stats -dir ./data)
    cmds:
      - go run {{.MAIN}} {{.CLI_ARGS}}

  test:
    cmds:
      - go test -count=1 ./...

  test:race:
    env:
      CGO_ENABLED: "1"
    cmds:
      - go test -race -count=1 ./...

  vet:
    cmds:
      - go vet ./...

  lint:
    cmds:
      - golangci-lint run ./...

  fmt:
    cmds:
      - golangci-lint fmt ./...

  fuzz:
    desc: Fuzz the record format for 30s (FuzzRecord); FuzzDB is run by hand with -fuzztime 120s
    cmds:
      - go test ./internal/record/ -run '^$' -fuzz '^FuzzRecord$' -fuzztime 30s

  bench:
    desc: kvlite-only Go benchmarks (placeholder until WS-D lands; use scripts/bench.ps1 for baselines)
    cmds:
      - go test -run '^$' -bench . -benchmem ./internal/bench/...

  compare:
    desc: Cross-engine benchmarks (kvlite vs bbolt vs pebble) in the nested bench/ module
    dir: bench
    cmds:
      - go test -run '^$' -bench . -benchmem ./...

  check:
    desc: tidy + vet + lint + test (+ the nested module's build/vet)
    deps: [tidy]
    cmds:
      - task: vet
      - task: lint
      - task: test
      - cmd: go build ./...
        dir: bench
      - cmd: go vet ./...
        dir: bench

  release:check:
    desc: Validate .goreleaser.yaml
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Local cross-platform build into dist/
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    cmds:
      - '{{if eq OS "windows"}}powershell -NoProfile -Command "Remove-Item -Recurse -Force bin, dist, results -ErrorAction SilentlyContinue"{{else}}rm -rf bin dist results{{end}}'
